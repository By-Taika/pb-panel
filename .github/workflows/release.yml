name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release (draft)
        id: create_release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `pb-panel ${tag}`,
              body: `## pb-panel ${tag}\n\nYeni sürüm. Değişiklikler için [CHANGELOG](../../blob/main/CHANGELOG.md).\n\n### İndir\n- **macOS (Apple Silicon)**: \`pb-panel_*_aarch64.dmg\`\n- **Windows**: \`pb-panel_*_x64_en-US.msi\` veya \`pb-panel_*_x64-setup.exe\`\n\nÖnceki sürümden güncelleme yapıyorsan panel kendi auto-updater'ı ile indirmeyi teklif edecek.\n\n### Kurulum notları\n- **macOS**: Gatekeeper uyarısı çıkarsa sağ tık → Aç, ya da \`xattr -d com.apple.quarantine /Applications/pb-panel.app\`.\n- **Windows**: SmartScreen uyarısı çıkarsa "Ek bilgiler → Yine de çalıştır".`,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            bundle_subdir: macos
            bundle_glob: "*.app.tar.gz *.app.tar.gz.sig *.dmg"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_subdir: nsis
            bundle_glob: "*.exe *.nsis.zip *.nsis.zip.sig"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (direct, no tauri-action)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Sanity check — env var'ın dolu gelip gelmediğini doğrula (değeri yazmıyoruz, sadece uzunluk).
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty! Updater artifacts will not be signed."
            exit 1
          fi
          echo "Signing key present (length=${#TAURI_SIGNING_PRIVATE_KEY})"
          npx tauri build --target ${{ matrix.target }}

      # Bundle içeriğini listele — hangi artifact'lar üretildi görebilelim.
      - name: List bundle outputs
        shell: bash
        run: |
          echo "--- bundle/${{ matrix.bundle_subdir }} ---"
          ls -la "src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle_subdir }}/" || true
          echo "--- bundle root ---"
          ls -la "src-tauri/target/${{ matrix.target }}/release/bundle/" || true

      # macOS tarafında Gatekeeper workaround script'ini release'e ekle.
      - name: Upload Gatekeeper helper (macOS only)
        if: matrix.platform == 'macos-14'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          gh release upload "$TAG" scripts/fix-gatekeeper.command --clobber --repo "${{ github.repository }}"

      # Bundle dizinindeki installer + updater paketini + .sig dosyasını release'e yükle.
      - name: Upload all bundle artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          BUNDLE_ROOT="src-tauri/target/${{ matrix.target }}/release/bundle"
          # Her glob pattern'ini tüm bundle alt-dizinlerinde ara, bulunanları yükle.
          for pat in ${{ matrix.bundle_glob }}; do
            # shellcheck disable=SC2086
            while IFS= read -r -d '' f; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              echo "Uploading $name"
              gh release upload "$TAG" "$f" --clobber --repo "${{ github.repository }}"
            done < <(find "$BUNDLE_ROOT" -type f -name "$pat" -print0 2>/dev/null)
          done

          # macOS MSI yerine Windows MSI de var — onu da yükle (matrix'te NSIS bundle_subdir tanımlı ama MSI'yi de atalım).
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            while IFS= read -r -d '' f; do
              echo "Uploading (extra) $(basename "$f")"
              gh release upload "$TAG" "$f" --clobber --repo "${{ github.repository }}"
            done < <(find "$BUNDLE_ROOT/msi" -type f \( -name "*.msi" -o -name "*.msi.sig" -o -name "*.msi.zip" -o -name "*.msi.zip.sig" \) -print0 2>/dev/null)
          fi

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          mkdir -p ./sigs
          gh release download "$TAG" --pattern "*.sig" --dir ./sigs --repo "$REPO" || true
          echo "--- downloaded .sig files ---"
          ls -la ./sigs || true

          mac_sig_file=$(ls ./sigs/*.app.tar.gz.sig 2>/dev/null | head -1 || true)
          win_sig_file=$(ls ./sigs/*.nsis.zip.sig 2>/dev/null | head -1 || true)

          mac_sig=""
          win_sig=""
          [ -n "$mac_sig_file" ] && mac_sig=$(cat "$mac_sig_file")
          [ -n "$win_sig_file" ] && win_sig=$(cat "$win_sig_file")

          # `npx tauri build` emits pb-panel.app.tar.gz without an arch suffix —
          # keep the URL matching the actual asset name or users get a 404.
          mac_url="https://github.com/${REPO}/releases/download/${TAG}/pb-panel.app.tar.gz"
          win_url="https://github.com/${REPO}/releases/download/${TAG}/pb-panel_${VERSION}_x64-setup.nsis.zip"

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "pb-panel ${VERSION} — see CHANGELOG",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${mac_sig}",
                "url": "${mac_url}"
              },
              "windows-x86_64": {
                "signature": "${win_sig}",
                "url": "${win_url}"
              }
            }
          }
          EOF

          echo "--- latest.json ---"
          cat latest.json

          gh release upload "$TAG" latest.json --clobber --repo "$REPO"

      - name: Publish release (undraft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --repo "$REPO"
